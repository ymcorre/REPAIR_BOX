<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RFID Repair Box</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 15px; background: #f4f6f9; color: #333; margin: 0; }
    .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
    .badge-display { font-size: 28px; font-weight: bold; color: #007bef; margin: 10px 0; letter-spacing: 1px; }
    .status { font-weight: bold; padding: 5px 10px; border-radius: 20px; display: inline-block; font-size: 14px; }
    .online { background: #e6f4ea; color: #137333; }
    .offline { background: #fce8e6; color: #c5221f; }
    
    /* Zone Photo */
    #camera-zone { display: none; margin-top: 15px; }
    #preview { width: 100%; max-width: 320px; border-radius: 10px; transform: scaleX(-1); background: #000; }
    #photo-capturee { width: 100%; max-width: 320px; border-radius: 10px; display: none; margin: 10px auto; }
    
    button { background: #007bef; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; max-width: 300px; margin: 5px 0; }
    button.secondary { background: #34a853; }
    button:disabled { background: #ccc; }
    .log-item { text-align: left; font-size: 13px; border-bottom: 1px solid #eee; padding: 8px 0; }
  </style>
</head>
<body>

  <h2 style="color: #202124; margin-top: 10px;">🧰 RFID Repair Box</h2>
  
  <!-- ÉTAT DE CONNEXION PICO -->
  <div class="card">
    <div id="pico-status" class="status offline">Recherche du boîtier matériel...</div>
    <div class="badge-display" id="uid-view">-------</div>
    <div id="scan-time" style="font-size: 12px; color: #666;">Passez un badge devant l'antenne</div>
  </div>

  <!-- APPAREIL PHOTO (DÉGÂTS / CONFIGURATION) -->
  <div class="card" id="camera-card" style="display:none;">
    <h3>📸 Documenter l'événement</h3>
    <button id="start-cam-btn" onclick="ouvrirCamera()">Ouvrir l'appareil photo</button>
    
    <div id="camera-zone">
      <video id="preview" autoplay playsinline></video>
      <button onclick="prendrePhoto()">📸 Déclencher</button>
    </div>
    
    <canvas id="canvas" style="display:none;"></canvas>
    <img id="photo-capturee" alt="Rapport de réparation">
    
    <button id="save-btn" class="secondary" onclick="validerEtSauvegarder()" style="display:none;">💾 Enregistrer l'intervention</button>
  </div>

  <!-- SYNCHRONISATON CLOUD -->
  <div class="card">
    <h3>☁️ Synchronisation</h3>
    <p>Interventions stockées localement : <strong id="local-count" style="font-size: 18px; color: #007bef;">0</strong></p>
    <button id="sync-btn" onclick="synchroniserCloud()">Envoyer les données au Cloud</button>
    <div id="log-zone" style="margin-top: 15px; max-height: 150px; overflow-y: auto;"></div>
  </div>

  <script>
    // --- 1. ACTIVATION SERVICE WORKER ---
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

    // --- 2. CONFIGURATION DE LA BASE DE DONNÉES LOCALES (IndexedDB) ---
    let db;
    const request = indexedDB.open("RepairBoxStore", 1);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      db.createObjectStore("interventions", { keyPath: "id", autoIncrement: true });
    };
    request.onsuccess = (e) => { db = e.target.result; majCompteurLocal(); rafraichirLogs(); };

    // --- 3. VARIABLES ET FLUX APPAREIL PHOTO ---
    let fluxVideo = null;
    let currentUID = "";
    let base64Photo = null;

    async function ouvrirCamera() {
      document.getElementById("camera-zone").style.display = "block";
      document.getElementById("start-cam-btn").style.display = "none";
      fluxVideo = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
      document.getElementById("preview").srcObject = fluxVideo;
    }

    function prendrePhoto() {
      const video = document.getElementById("preview");
      const canvas = document.getElementById("canvas");
      canvas.width = video.videoWidth / 2; // Réduction de taille pour optimiser la mémoire IndexedDB
      canvas.height = video.videoHeight / 2;
      
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      base64Photo = canvas.toDataURL('image/jpeg', 0.7); // Compression JPEG à 70%
      
      document.getElementById("photo-capturee").src = base64Photo;
      document.getElementById("photo-capturee").style.display = "block";
      document.getElementById("camera-zone").style.display = "none";
      document.getElementById("save-btn").style.display = "block";
      
      // Arrêt de la caméra pour économiser la batterie
      if(fluxVideo) { fluxVideo.getTracks().forEach(track => track.stop()); }
    }

    // --- 4. POLLING HTTP CONTINU VERS LA PICO ---
    setInterval(async () => {
      try {
        const res = await fetch("http://192.168.4", { mode: 'cors' });
        const data = await res.json();
        
        const statusDiv = document.getElementById("pico-status");
        statusDiv.innerText = "Connecté au boîtier Pico-Scanner";
        statusDiv.className = "status online";

        if (data.uid && data.nouveau) {
          currentUID = data.uid;
          document.getElementById("uid-view").innerText = data.uid;
          document.getElementById("scan-time").innerText = "Scan enregistré à " + new Date().toLocaleTimeString();
          
          if (navigator.vibrate) navigator.vibrate([100, 50, 100]); // Double vibration smartphone
          
          // Affichage du module photo pour documenter ce scan précis
          document.getElementById("camera-card").style.display = "block";
          document.getElementById("start-cam-btn").style.display = "block";
          document.getElementById("photo-capturee").style.display = "none";
          document.getElementById("save-btn").style.display = "none";
        }
      } catch (err) {
        const statusDiv = document.getElementById("pico-status");
        statusDiv.innerText = "Hors de portée Wi-Fi de la Pico...";
        statusDiv.className = "status offline";
      }
    }, 1200);

    // --- 5. PERSISTANCE EN LOCAL ---
    function validerEtSauvegarder() {
      if (!currentUID) return;
      const tx = db.transaction(["interventions"], "readwrite");
      const store = tx.objectStore("interventions");
      
      store.add({
        uid: currentUID,
        photo: base64Photo, // Stockage direct de l'image compressée
        date: new Date().toLocaleString()
      });

      tx.oncomplete = () => {
        majCompteurLocal();
        rafraichirLogs();
        document.getElementById("camera-card").style.display = "none";
        document.getElementById("uid-view").innerText = "-------";
        document.getElementById("scan-time").innerText = "Enregistré avec succès ! En attente d'un nouveau badge...";
        base64Photo = null;
      };
    }

    function majCompteurLocal() {
      if (!db) return;
      const tx = db.transaction(["interventions"], "readonly");
      const store = tx.objectStore("interventions");
      const countReq = store.count();
      countReq.onsuccess = () => { document.getElementById("local-count").innerText = countReq.result; };
    }

    function rafraichirLogs() {
      if (!db) return;
      const zone = document.getElementById("log-zone");
      zone.innerHTML = "";
      const tx = db.transaction(["interventions"], "readonly");
      tx.objectStore("interventions").openCursor(null, "prev").onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
          zone.innerHTML += `<div class="log-item">⏱️ ${cursor.value.date} - 🆔 <strong>${cursor.value.uid}</strong> ${cursor.value.photo ? '📸 avec photo':''}</div>`;
          cursor.continue();
        }
      };
    }

    // --- 6. SYNCHRONISATION FUTURE ---
    function synchroniserCloud() {
      alert("Étape finale du terrain : Déconnectez-vous du Wi-Fi Pico, retrouvez internet, puis validez l'envoi vers Google Sheets.");
    }
  </script>
</body>
</html>
